<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendeteksi Kematangan Pepaya</title>
<style>
  :root { --bg:#eef3ea; --card:#fff; --ink:#17261d; --muted:#566559; --line:#cfdac9; --accent:#e8731a; --on:#fff; --focus:#1f6f43; box-sizing:border-box; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101a14; --card:#18271e; --ink:#eaf3e6; --muted:#9db3a2; --line:#2c4333; --accent:#f28c28; --on:#1a1208; --focus:#7fd6a0; } }
  *,*::before,*::after { box-sizing:inherit; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; line-height:1.55; }
  main { max-width:640px; margin:0 auto; padding:2rem 1.25rem 4rem; }
  h1 { font-size:clamp(1.9rem,6vw,2.5rem); line-height:1.1; margin:0 0 .5rem; letter-spacing:-.02em; }
  .sub, .muted { color:var(--muted); }
  .muted { font-size:.9rem; }
  .card { background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:1.25rem; margin-top:1.25rem; }
  .row { display:flex; flex-wrap:wrap; gap:.6rem; }
  button, .btn { font:inherit; font-weight:600; padding:.6rem 1.1rem; border-radius:10px; border:0; background:var(--accent); color:var(--on); cursor:pointer; display:inline-block; }
  button.alt, .btn.alt { background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  button:focus-visible, .btn:focus-within { outline:3px solid var(--focus); outline-offset:2px; }
  input[type=file] { position:absolute; opacity:0; width:1px; height:1px; }
  .stage { position:relative; margin-top:1rem; border-radius:12px; overflow:hidden; background:#0003; display:none; }
  .stage video, .stage canvas { display:block; width:100%; height:auto; }
  .stage .box { position:absolute; left:20%; top:20%; width:60%; height:60%; border:2px dashed #fff; border-radius:10px; pointer-events:none; box-shadow:0 0 0 9999px #0000004d; }
  .bar { display:grid; grid-template-columns:5.5rem 1fr 3rem; gap:.6rem; align-items:center; font-size:.9rem; margin:.3rem 0; }
  .bar div { height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; transition:width .3s; }
  h2 { margin:1rem 0 .2rem; font-size:1.7rem; }
  .meter { position:relative; height:12px; border-radius:6px; margin:1rem 0 .3rem; background:linear-gradient(90deg,#2f6b2c,#8fb33a,#e8b72f,#e8731a,#8a4a14); }
  .meter i { position:absolute; top:-5px; width:6px; height:22px; background:var(--ink); border-radius:3px; transform:translateX(-50%); left:0; transition:left .3s; box-shadow:0 0 0 2px var(--card); }
  .scale { display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<main>
  <h1>Pendeteksi kematangan pepaya</h1>
  <p class="sub">Arahkan kamera ke pepaya atau upload fotonya. Kematangan dihitung dari warna kulit buah.</p>

  <div class="card">
    <div class="row">
      <button id="camBtn" type="button">Buka kamera</button>
      <button id="snapBtn" type="button" class="alt" hidden>Berhenti</button>
      <label class="btn alt">Upload foto<input type="file" id="file" accept="image/*"></label>
    </div>

    <div class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="photo" hidden></canvas>
      <div class="box"></div>
    </div>

    <div id="result" hidden>
      <h2 id="name"></h2>
      <p id="tip"></p>
      <div class="meter"><i id="pin"></i></div>
      <div class="scale"><span>Mentah</span><span>Matang</span><span>Terlalu matang</span></div>
      <div style="margin-top:1rem">
        <div class="bar"><span>Hijau</span><div><i id="b0" style="background:#4d8a3a"></i></div><span id="p0"></span></div>
        <div class="bar"><span>Kuning</span><div><i id="b1" style="background:#e2b52f"></i></div><span id="p1"></span></div>
        <div class="bar"><span>Oranye</span><div><i id="b2" style="background:#e8731a"></i></div><span id="p2"></span></div>
        <div class="bar"><span>Cokelat</span><div><i id="b3" style="background:#8a4a14"></i></div><span id="p3"></span></div>
      </div>
    </div>
    <p class="muted" id="msg">Tips: cahaya terang, latar polos, dan penuhi kotak putus-putus dengan buahnya. Gambar tidak diupload ke mana pun.</p>
  </div>
</main>

<script>
var STAGES = ["Mentah","Mulai matang","Hampir matang","Matang sempurna","Terlalu matang"];
var TIPS = [
  "Masih keras dan hambar. Cocok untuk sayur atau urap.",
  "Belum manis. Tunggu 3 sampai 4 hari di suhu ruang.",
  "Hampir siap. Tunggu 1 sampai 2 hari untuk rasa terbaik.",
  "Waktu terbaik untuk dimakan. Simpan di kulkas kalau belum sempat.",
  "Sudah lewat puncak. Cicipi dulu, olah jadi smoothie atau buang kalau asam."
];
var PINS = [6, 28, 50, 73, 94];
var $ = function (id) { return document.getElementById(id); };
var work = document.createElement("canvas"), wctx = work.getContext("2d", { willReadFrequently: true });
var stream = null, timer = null;

function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, mx ? d / mx : 0, mx];
}
function stageFor(m) { return m < 0.75 ? 0 : m < 1.75 ? 1 : m < 2.6 ? 2 : m < 3.5 ? 3 : 4; }

/* Analisis kotak tengah (60% x 60%) dari sumber gambar/video */
function analyze(src, sw, sh) {
  work.width = 240; work.height = Math.round(240 * sh / sw) || 180;
  wctx.drawImage(src, 0, 0, work.width, work.height);
  var x = Math.floor(work.width * .2), y = Math.floor(work.height * .2);
  var w = Math.floor(work.width * .6), h = Math.floor(work.height * .6);
  var d = wctx.getImageData(x, y, w, h).data;
  var c = [0, 0, 0, 0], score = 0, used = 0, total = d.length / 4;
  for (var i = 0; i < d.length; i += 4) {
    var p = rgb2hsv(d[i], d[i + 1], d[i + 2]), H = p[0], S = p[1], V = p[2];
    if (S < 0.25 || V < 0.15) continue;                      // abaikan latar abu/putih/hitam
    var cat, val;
    if (H < 45 && V < 0.45) { cat = 3; val = 4; }            // cokelat / bercak
    else if (H >= 90 && H <= 170) { cat = 0; val = 0; }      // hijau tua
    else if (H >= 60 && H < 90) { cat = 0; val = 1; }        // hijau kekuningan
    else if (H >= 45 && H < 60) { cat = 1; val = 2.2; }      // kuning
    else if (H >= 12 && H < 45) { cat = 2; val = 3.2; }      // oranye
    else continue;
    c[cat]++; used++; score += val;
  }
  if (used < total * 0.08) return null;
  return { pct: c.map(function (n) { return Math.round(n / used * 100); }), mean: score / used };
}

function show(res) {
  if (!res) { $("result").hidden = true; $("msg").textContent = "Pepaya belum terdeteksi. Dekatkan buah ke kamera dan pakai latar polos."; return; }
  var s = stageFor(res.mean);
  $("result").hidden = false;
  $("name").textContent = STAGES[s];
  $("tip").textContent = TIPS[s];
  $("pin").style.left = PINS[s] + "%";
  res.pct.forEach(function (v, i) { $("b" + i).style.width = v + "%"; $("p" + i).textContent = v + "%"; });
  $("msg").textContent = "Hasil berupa perkiraan dari warna. Cara paling pasti tetap dengan mencicipi.";
}

/* Kamera langsung */
$("camBtn").onclick = async function () {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
  } catch (e) {
    $("msg").textContent = "Kamera tidak bisa dibuka. Izinkan akses kamera, atau pakai tombol Upload foto.";
    return;
  }
  $("photo").hidden = true; $("video").hidden = false; $("stage").style.display = "block";
  $("video").srcObject = stream; await $("video").play();
  $("camBtn").hidden = true; $("snapBtn").hidden = false;
  timer = setInterval(function () {
    var v = $("video"); if (v.videoWidth) show(analyze(v, v.videoWidth, v.videoHeight));
  }, 500);
};
function stopCam() {
  clearInterval(timer); timer = null;
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  $("camBtn").hidden = false; $("snapBtn").hidden = true;
}
$("snapBtn").onclick = stopCam;

/* Upload foto */
$("file").addEventListener("change", function (e) {
  var f = e.target.files[0]; if (!f) return;
  stopCam();
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var cv = $("photo");
    cv.width = img.width; cv.height = img.height;
    cv.getContext("2d").drawImage(img, 0, 0);
    $("video").hidden = true; cv.hidden = false; $("stage").style.display = "block";
    show(analyze(img, img.width, img.height));
    URL.revokeObjectURL(url);
  };
  img.onerror = function () { $("msg").textContent = "File tidak bisa dibaca sebagai gambar."; };
  img.src = url;
});
</script>
</body>
</html>
